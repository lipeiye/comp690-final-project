# Every layer of tools/check.py on each push and pull request: format, lint ratchet,
# project guard (including the historical-evidence hashes) and the unit tests.
name: checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      UV_PROJECT_ENVIRONMENT: .venv.nosync
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.24"
      - run: uv sync --locked
      - run: python3 tools/check.py
      # every generator that needs no EEG data (electrode and redundancy read session data): rebuilt
      # outputs must equal the committed ones
      - run: python3 tools/golden.py analysis int8 report slides slides-midterm manifest audit
